<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirRunner - Sign In</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="split-container">
    <!-- Left Side: Hero Image -->
    <div class="hero-section">
      <!-- Background handled in CSS -->
    </div>

    <!-- Right Side: Auth Form -->
    <div class="auth-section">
      <div class="auth-form-container">

        <h2 id="auth-title">Sign Up <span class="highlight">to unleash the gamer within you!</span></h2>

        <form id="auth-form">
          <div class="input-group">
            <label for="pilotName">Name</label>
            <input type="text" id="pilotName" required minlength="3" maxlength="40" autocomplete="name" placeholder="Your Name">
          </div>

          <div class="input-group">
            <label for="gamerId">Gamer Id</label>
            <input type="text" id="gamerId" required minlength="3" maxlength="30" autocomplete="username" placeholder="Unique Gamer ID">
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email" placeholder="your@email.com">
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
          </div>

          <p class="error-msg" id="auth-error" role="alert"></p>

          <button type="submit" class="btn-primary" id="submit-btn">Sign Up</button>

          <div class="toggle-mode">
            <p><span id="toggle-prompt">Already have an account?</span> <a href="#" id="toggle-link">Sign In</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
